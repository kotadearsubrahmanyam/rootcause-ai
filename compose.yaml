services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rootcause
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause -d rootcause"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    networks: [default, validation]
    build: ./api
    environment:
      PGHOST: db
      PGDATABASE: rootcause
      PGUSER: rootcause
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  validator:
    build:
      context: ./demo
      target: validation
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 48
    networks: [validation]
  worker:
    build: ./api
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: rootcause
      PGUSER: rootcause
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
  collector:
    image: otel/opentelemetry-collector:0.123.0
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      api:
        condition: service_healthy
  inventory:
    build: ./demo
    environment:
      STORE_SERVICE: inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on:
      collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  orders:
    build: ./demo
    environment:
      STORE_SERVICE: orders
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on:
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  checkout:
    build: ./demo
    environment:
      STORE_SERVICE: checkout
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_URL: http://api:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run setup.ps1}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
networks:
  validation:
    internal: true
volumes:
  db_data:
