services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rootcause
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.ps1}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause -d rootcause"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      PGHOST: db
      PGDATABASE: rootcause
      PGUSER: rootcause
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_URL: http://api:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run setup.ps1}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data:
