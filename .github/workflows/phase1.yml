name: Phase 1 acceptance
on:
  push:
    paths:
      - '.github/workflows/phase1.yml'
      - 'web/**'
      - 'api/**'
      - 'demo/**'
      - 'collector.yaml'
      - 'compose.yaml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral local configuration
        run: pwsh -File setup.ps1
      - name: Start the complete application
        run: docker compose up --build --wait --wait-timeout 120
      - name: Check guest navigation and protected entry
        shell: bash
        run: |
          set -eu
          base=http://localhost:3000
          curl -fsS --retry 20 --retry-connrefused "$base/" -o /tmp/entry
          grep -F 'Explore demo' /tmp/entry
          curl -fsS "$base/workspace?demo=1" -o /tmp/overview
          grep -q '>Connected<' /tmp/overview
          grep -q 'Demo store' /tmp/overview
          curl -fsS "$base/workspace?demo=1&view=incidents" -o /tmp/incidents
          grep -q 'No incidents recorded' /tmp/incidents
          curl -fsS "$base/workspace?demo=1&view=history" -o /tmp/history
          grep -q 'No investigations yet' /tmp/history
          landing=$(curl -LsS -o /dev/null -w '%{url_effective}' "$base/workspace")
          test "$landing" = "$base/"
      - name: Replay checkout and verify captured evidence
        run: |
          docker compose exec -T api python - <<'PY'
          import httpx, time
          api = "http://localhost:8000"
          for _ in range(2):
              assert httpx.post(api+"/demo/checkout").json()["checkout_status"] == 502
          for _ in range(30):
              incidents = httpx.get(api+"/demo/incidents").json()
              if incidents and incidents[0]["count"] == 2 and len(incidents[0]["spans"]) == 3:
                  break
              time.sleep(1)
          print(incidents, flush=True)
          report, = incidents
          assert report["count"] == 2, report
          assert {s["service"]:int(s["status"]) for s in report["spans"]} == {"checkout":502,"orders":502,"inventory":200}
          assert report["previous"] != report["revision"] and '+    return {"available_quantity": 5}' in report["diff"]
          assert any("quantity" in s["message"] for s in report["spans"])
          PY
          curl -fsS 'http://localhost:3000/workspace?demo=1&view=incidents' -o /tmp/evidence
          grep -q 'Deployment change' /tmp/evidence
      - name: Verify investigation retry, tools, streaming and persistence
        run: |
          docker compose exec -T api python - <<'PY'
          """Exercise Phase 3 using real captured traces and a scripted Groq HTTP response."""
          import json
          import time
          
          import httpx
          import psycopg
          from groq import Groq
          
          from worker import process
          
          api = "http://localhost:8000"
          trace = httpx.get(api + "/demo/incidents").json()[0]["trace"]
          url = f"{api}/investigations/{trace}"
          assert httpx.post(url).is_success
          # CI runs without credentials. Verify a recoverable error is persisted.
          for _ in range(30):
              job = httpx.get(url).json()
              if job["status"] == "failed":
                  break
              time.sleep(0.3)
          assert "GROQ_API_KEY" in job["error"]
          PY
          docker compose stop worker
          docker compose exec -T api python - <<'PY'
          import json
          
          import httpx
          import psycopg
          from groq import Groq
          from worker import process
          
          api = "http://localhost:8000"
          trace = httpx.get(api + "/demo/incidents").json()[0]["trace"]
          url = f"{api}/investigations/{trace}"
          assert httpx.post(url).is_success
          calls = []
          def provider(request):
              messages = json.loads(request.content)["messages"]
              if calls:
                  assert messages[-1]["role"] == "tool"
                  assert json.loads(messages[-1]["content"])
              name = ["read_trace", "read_diff", "read_source", "submit_diagnosis"][len(calls)]
              args = {}
              if name == "submit_diagnosis":
                  assert "inventory.py:2" in json.loads(messages[-1]["content"])
                  args = {"cause": "Inventory renamed quantity.", "citations": ["trace:orders","deployment:diff","inventory.py:2"],
                          "uncertainty": "Demo fixture only", "proposed_patch": "Restore quantity as an alias."}
              calls.append(name)
              return httpx.Response(200, json={"id":"ci","object":"chat.completion","created":1,"model":"test",
                  "choices":[{"index":0,"finish_reason":"tool_calls","message":{"role":"assistant","content":None,
                  "tool_calls":[{"id":name,"type":"function","function":{"name":name,"arguments":json.dumps(args)}}]}}]})
          
          client = Groq(api_key="ci-fixture", http_client=httpx.Client(transport=httpx.MockTransport(provider)))
          with psycopg.connect(autocommit=True) as db:
              assert process(db, client)
              assert httpx.post(url).is_success
              assert not process(db, client)
          job = httpx.get(url).json()
          assert job["status"] == "done" and len(job["result"]["evidence"]) == 3, job
          assert len(job["steps"]) == 4
          assert trace in httpx.get(url+"/events").text
          assert httpx.get(api+"/investigations").json()[0]["trace"] == trace
          PY
      - name: Diagnose missing spans
        if: failure()
        run: docker compose logs --tail=80 api collector checkout inventory orders
      - name: Report service status
        if: always()
        run: docker compose ps -a
